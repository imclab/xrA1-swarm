<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agent Bird's-Eye View</title>
  <style>
    :root {
      --bg: #0b1220;
      --panel: #111b2f;
      --text: #eaf2ff;
      --muted: #98a7c4;
      --line: #223252;
      --ok: #28c76f;
      --warn: #ffb020;
      --bad: #ff5c7c;
      --run: #40c4ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      background: radial-gradient(circle at 20% 0%, #15243f, var(--bg) 42%);
      color: var(--text);
    }
    .wrap { max-width: 1280px; margin: 0 auto; padding: 18px; }
    .card {
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .meta { color: var(--muted); font-size: 12px; }
    .countdown {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border: 1px solid #2a3f68;
      background: linear-gradient(180deg, rgba(64,196,255,0.10), rgba(255,176,32,0.06));
      border-radius: 14px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }
    .countdown-clock {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #ffffff;
    }
    .countdown-label {
      font-size: 11px;
      color: var(--muted);
    }
    .countdown.urgent {
      border-color: rgba(255,92,124,0.8);
      box-shadow: 0 0 24px rgba(255,92,124,0.26);
      animation: pulse 0.9s ease-in-out infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.01); }
      100% { transform: scale(1); }
    }
    .btn {
      appearance: none;
      border: 1px solid #2f4f80;
      background: #193158;
      color: #eaf2ff;
      border-radius: 10px;
      padding: 7px 11px;
      font-size: 11px;
      cursor: pointer;
    }
    .btn[disabled] {
      opacity: 0.6;
      cursor: default;
    }
    .timeline {
      position: relative;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      padding: 12px;
      min-height: 260px;
    }
    .lane {
      position: relative;
      height: 44px;
      border-bottom: 1px dashed #1d2a45;
      margin-bottom: 8px;
      padding-left: 170px;
    }
    .lane:last-child { border-bottom: 0; }
    .lane-label {
      position: absolute;
      left: 0;
      top: 12px;
      width: 164px;
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .event {
      position: absolute;
      top: 10px;
      height: 22px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.2);
      background: #2d4874;
      color: #f5fbff;
      font-size: 10px;
      padding: 3px 6px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .event.completed { background: rgba(40,199,111,0.35); }
    .event.running, .event.started { background: rgba(64,196,255,0.35); }
    .event.blocked, .event.failed { background: rgba(255,92,124,0.35); }
    .event.skipped { background: rgba(255,176,32,0.35); }
    .playhead {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--run);
      box-shadow: 0 0 12px var(--run);
      pointer-events: none;
      animation: scan linear infinite;
    }
    @keyframes scan {
      from { left: 170px; }
      to { left: calc(170px + var(--timeline-width)); }
    }
    .legend { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; font-size: 11px; color: var(--muted); }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; }
    .list { margin-top: 10px; font-size: 11px; color: var(--muted); max-height: 220px; overflow: auto; }
    .list-row { padding: 6px 8px; border-bottom: 1px solid #1d2a45; }
  </style>
</head>
